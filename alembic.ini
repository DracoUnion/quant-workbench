[alembic]
# path to migration scripts
script_location = src/alembic

# database url will be overridden by environment variable DATABASE_URL
sqlalchemy.url = sqlite:///src/data/fin_workbench.db

# version location
version_locations = src/alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "version" column
# version_len = 32

# locale used when rendering date
# in migration files and otherwise.
# leave blank for default locale.
# precedes the "encoding" option.
# locale =

# target database charset
# db_charset =

# max length of character field names.
# max_ident_len =

# the set of characters allowed in names
# of tables/indexes/columns etc.
# precludes the "sql.word" setting.
# valid_chars =

# the style to use for the date type
# default "date" (python date), "datetime" (python datetime)
# or "columndate" (string date in migration file).
# sqlalchemy_date_type =

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding =

# version_location =

# the version locator to use
# version_locator =


[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
