[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-workbench"
version = "1.0.0"
description = "金融智能体工作台（QuantWorkbench） - 零代码 AI 金融智能体构建平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.8",
    "pytest>=8.2",
    "pytest-asyncio>=0.21",
]

[project.optional-dependencies]
celery = ["celery>=5.2", "redis>=4.0"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
fin-workbench = "src.main:main"

[tool.setuptools]
packages = ["src", "src.alembic", "src.alembic.versions", "src.common", "src.core", "src.models", "src.services", "src.agents", "src.tools", "src.adapters", "src.tasks", "src.ui", "src.gui", "src.clients", "seed", "tests"]

[tool.setuptools.package-data]
src = ["data/*", "*.ini", "*.toml", "*.txt", "*.env"]
